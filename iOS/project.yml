name: WiperBladeTracker
options:
  bundleIdPrefix: com.shimondeitel.wipertrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  WiperBladeTracker:
    type: application
    platform: iOS
    sources:
      - path: WiperBladeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.wipertrack
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: WiperBladeTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  WiperBladeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WiperBladeTrackerTests
      - path: WiperBladeTracker.storekit
    dependencies:
      - target: WiperBladeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.wipertrack.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  WiperBladeTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WiperBladeTrackerUITests
    dependencies:
      - target: WiperBladeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.wipertrack.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  WiperBladeTracker:
    build:
      targets:
        WiperBladeTracker: all
        WiperBladeTrackerTests: [test]
        WiperBladeTrackerUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: WiperBladeTracker.storekit
    test:
      config: Debug
      storeKitConfiguration: WiperBladeTracker.storekit
      targets:
        - WiperBladeTrackerTests
        - WiperBladeTrackerUITests
    archive:
      config: Release
